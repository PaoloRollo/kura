[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
ffi = false

# CardVault sits at the EIP-170 limit (test/Size.t.sol), so it alone is optimised for size.
additional_compiler_profiles = [{ name = "vault", optimizer_runs = 1 }]
compilation_restrictions = [{ paths = "src/CardVault.sol", optimizer_runs = 1 }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
